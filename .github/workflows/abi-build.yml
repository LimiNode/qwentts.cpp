name: ABI and CPU build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  cpu-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DQWEN_SHARED=ON -DGGML_NATIVE=OFF
      - name: Build shared library and regression tests
        run: cmake --build build --target qwen test-abi-c test-sampling-contract test-sampling-graph-contract test-eos-guard-contract --parallel 2
      - name: Run ABI probe and sampling contract
        run: |
          ./build/test-abi-c
          ctest --test-dir build --output-on-failure -R '^(sampling(_graph)?_contract(_python_parity)?|sampler_diagnostic_python|first_mismatch_python|eos_guard_contract)$'
      - name: Build and test opt-in research seam
        run: |
          cmake -S . -B build -DQWEN_RESEARCH_FRAME_SEEDS=ON -DQWEN_RESEARCH_PREFILL=ON
          cmake --build build --target eos-research-probe test-frame-seed-contract test-prefill-settings-contract --parallel 2
          ctest --test-dir build --output-on-failure -R '^(frame_seed_contract|prefill_settings_contract|prefill_research_python|speech_comparison_python|eos_research_observer_contract|eos_recovery_python|eos_research_(runner|analysis|corpus)_python)$'

  windows-msvc-shared:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DQWEN_SHARED=ON -DGGML_NATIVE=OFF
      - name: Build shared library and regression tests
        shell: pwsh
        run: cmake --build build --config Release --target qwen test-abi-c test-sampling-contract test-sampling-graph-contract test-eos-guard-contract --parallel 2
      - name: Run ABI probe and sampling contract
        shell: pwsh
        run: |
          .\build\Release\test-abi-c.exe
          ctest --test-dir build -C Release --output-on-failure -R '^(sampling(_graph)?_contract(_python_parity)?|sampler_diagnostic_python|first_mismatch_python|eos_guard_contract)$'
      - name: Build and test opt-in research seam
        shell: pwsh
        run: |
          cmake -S . -B build -DQWEN_RESEARCH_FRAME_SEEDS=ON -DQWEN_RESEARCH_PREFILL=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --target eos-research-probe test-frame-seed-contract test-prefill-settings-contract --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure -R '^(frame_seed_contract|prefill_settings_contract|prefill_research_python|speech_comparison_python|eos_research_observer_contract|eos_recovery_python|eos_research_(runner|analysis|corpus)_python)$'
