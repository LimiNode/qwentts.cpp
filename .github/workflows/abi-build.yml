name: ABI and CPU build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  cpu-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DQWEN_SHARED=ON -DGGML_NATIVE=OFF
      - name: Build shared library and ABI probe
        run: cmake --build build --target qwen test-abi-c --parallel 2
      - name: Run ABI probe
        run: ./build/test-abi-c
